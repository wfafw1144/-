name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --console=plain 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        with: { name: ghostmod, path: build/libs/*.jar }
      - name: publish jar to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" "$JAR" --title "$TAG" --notes "auto build" --target "${{ github.sha }}"
      - name: publish log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "fail-${{ github.run_number }}" build.log --title "fail-${{ github.run_number }}" --notes "build failed" --target "${{ github.sha }}" --prerelease
